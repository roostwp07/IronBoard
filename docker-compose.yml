services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ironboard_dev
      POSTGRES_USER: parmida
      POSTGRES_PASSWORD: postgres
    volumes:
      # Persist data between container restarts.
      - postgres_data:/var/lib/postgresql/data
      # Run schema.sql automatically on first startup.
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parmida -d ironboard_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend ───────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      # Overrides .env — uses the db service defined above.
      DATABASE_URL: postgresql://parmida:postgres@db:5432/ironboard_dev
      JWT_SECRET: ${JWT_SECRET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET: ${S3_BUCKET}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:

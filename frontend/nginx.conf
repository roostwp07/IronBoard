server {
    listen 80;

    # Serve the built React app from this directory.
    root /usr/share/nginx/html;
    index index.html;

    # For any URL that doesn't match a real file (e.g. /leaderboard,
    # /login), fall back to index.html so React Router handles routing.
    # Without this, refreshing a non-root URL would return a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward /api/* requests to the backend container.
    # In production (ECS), this will point to the backend service.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

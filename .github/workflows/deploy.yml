name: Deploy to EC2

# Run on every push to main.
on:
  push:
    branches: [main]

jobs:
  test:
    name: Run backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ironboard_test
          POSTGRES_USER: parmida
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Apply schema
        run: psql "postgresql://parmida:postgres@localhost:5432/ironboard_test" -f backend/schema.sql

      - name: Run tests
        run: npm test
        working-directory: backend
        env:
          DATABASE_URL: postgresql://parmida:postgres@localhost:5432/ironboard_test
          JWT_SECRET: test-secret-for-ci
          S3_BUCKET: test-bucket
          AWS_REGION: ca-central-1

  deploy:
    name: Build, push, and deploy
    runs-on: ubuntu-latest
    needs: test  # only deploy if tests pass
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ca-central-1

      - name: Log in to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/ironboard-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/ironboard-frontend:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Log Docker into ECR
            aws ecr get-login-password --region ca-central-1 | \
              docker login --username AWS --password-stdin \
              969079689895.dkr.ecr.ca-central-1.amazonaws.com

            # Pull the new images
            docker pull 969079689895.dkr.ecr.ca-central-1.amazonaws.com/ironboard-backend:latest
            docker pull 969079689895.dkr.ecr.ca-central-1.amazonaws.com/ironboard-frontend:latest

            # Restart containers with the new images
            cd ~ && docker-compose down && docker-compose up -d
